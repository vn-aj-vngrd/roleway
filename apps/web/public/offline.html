<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0069e1">
  <title>Offline · Roleway</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; color: #15171a; background: #fff; display: grid; place-items: center; }
    main { width: min(420px, 100%); }
    svg { display: block; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 10px 0 24px; color: #626872; line-height: 1.6; }
    button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 7px; color: #fff; background: #0069e1; font: inherit; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { color: #f4f6f8; background: #11151d; } p { color: #aab1bc; } }
  </style>
</head>
<body>
  <main>
    <svg aria-hidden="true" width="36" height="36" viewBox="0 0 64 64" fill="none">
      <rect x="2" y="2" width="60" height="60" rx="14" fill="#0069e1"/>
      <path d="M19.3 48V17.3h14c6.9 0 11.1 3.4 11.1 9s-4.2 9-11.1 9h-14m14.4 0L46.3 48" stroke="#fff" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46.3" cy="48" r="4" fill="#fff" stroke="#0069e1" stroke-width="1.3"/>
    </svg>
    <h1>You’re offline</h1>
    <p>Reconnect to open Roleway. Private workspace pages are not stored for offline use.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
