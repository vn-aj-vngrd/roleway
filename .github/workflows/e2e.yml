name: Browser journeys
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-journeys
  cancel-in-progress: false
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.E2E_AI_CREDENTIAL_ENCRYPTION_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3003
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require isolated test configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$AI_CREDENTIAL_ENCRYPTION_KEY"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roleway/web exec playwright install --with-deps chromium
      - run: pnpm --filter @roleway/web test:e2e
