name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3003
jobs:
  validate:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roleway_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: node scripts/validate-commit-message.mjs --pr-title
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:full
      - name: Validate migrations and Agent transactions
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: roleway_test
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/support/auth-schema.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/agent_transactions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/signup_admission.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/plans_billing.sql
          node scripts/plan-concurrency.test.mjs
